# Founder phone, third pass (NO clearState). Creates a PERSONAL vault
# as the second vault on this phone, then searches for the org entry
# while the personal vault is active: organization entries must never
# merge into a personal vault's search (G24 §4.2 — org Spaces are
# never merge-eligible).
#
#   MASTER_PW_2   the founder's PERSONAL vault password
appId: xyz.actitud.baluard
appLaunchDelay: 3000
---
- launchApp:
    clearState: false
- tapOn:
    id: "android:id/button2"
    optional: true
- assertVisible:
    id: "e2e/unlock/password"
- tapOn:
    id: "e2e/unlock/password"
- inputText: "${BALUARD_E2E_ORG_PW}"
- hideKeyboard
- tapOn:
    id: "e2e/unlock/submit"
- extendedWaitUntil:
    visible:
      id: "e2e/home/settings"
    timeout: 30000
# Positive control first: the org hub DOES hold the entry.
- extendedWaitUntil:
    visible:
      id: "e2e/list/search"
    timeout: 20000
- tapOn:
    id: "e2e/list/search"
- inputText: Org Wifi
- extendedWaitUntil:
    visible: "Org Wifi"
    timeout: 20000
# Second vault: personal, via the switcher's create row (plan-mobile-
# second-vault). The org vault itself was created first-run with the
# pre-filled default name, so its pill reads "Personal (N)" — matched
# by regex because the entry count rides the same text node. The new
# vault is named explicitly so the switcher never shows two identical
# rows.
- tapOn:
    text: ".*Personal.*"
- extendedWaitUntil:
    visible: "Create new vault"
    timeout: 20000
- tapOn: "Create new vault"
- extendedWaitUntil:
    visible:
      id: "e2e/create/name"
    timeout: 20000
- tapOn:
    id: "e2e/create/name"
- eraseText: 20
- inputText: Private
- hideKeyboard
- tapOn:
    id: "e2e/create/password"
- inputText: "${BALUARD_E2E_MASTER_PW_2}"
- hideKeyboard
- tapOn:
    id: "e2e/create/confirm"
- inputText: "${BALUARD_E2E_MASTER_PW_2}"
- hideKeyboard
- tapOn:
    id: "e2e/create/submit"
- scrollUntilVisible:
    element:
      id: "e2e/recovery/ack"
    timeout: 20000
- tapOn:
    id: "e2e/recovery/ack"
- scrollUntilVisible:
    element:
      id: "e2e/recovery/continue"
    timeout: 20000
- tapOn:
    id: "e2e/recovery/continue"
- extendedWaitUntil:
    visible:
      id: "e2e/list/search"
    timeout: 30000
# THE assertion: the org entry must not merge into the personal hub.
# Settle-first: type a query the personal entry matches, wait for it
# visibly (the merged search coroutine has resolved), then assert the
# org entry is absent — an immediate assertNotVisible could pass
# against the initial empty foreign-hits state.
- tapOn:
    id: "e2e/list/add"
- extendedWaitUntil:
    visible:
      id: "e2e/edit/name"
    timeout: 20000
- tapOn:
    id: "e2e/edit/name"
- inputText: Wifi Router
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e/edit/save"
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "e2e/edit/save"
- extendedWaitUntil:
    visible:
      id: "e2e/list/search"
    timeout: 20000
- tapOn:
    id: "e2e/list/search"
# The hub search query leaks across vault switches (shared list ViewModel);
# clear the positive-control query before typing the settle-first one.
- eraseText: 20
- inputText: Wifi
- extendedWaitUntil:
    visible: "Wifi Router"
    timeout: 20000
- assertNotVisible: "Org Wifi"
