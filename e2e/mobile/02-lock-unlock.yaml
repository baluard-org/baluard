# Baluard E2E, flow 02 (the E2E harness): lock and unlock
# with the master password. Runs after flow 01 on the same device.
appId: xyz.actitud.baluard
name: 02-lock-unlock
---
- launchApp
# Android 17's App Compatibility alert pops on every cold start; the
# optional tap no-ops when it is absent.
- tapOn:
    id: "android:id/button2"
    optional: true
- assertVisible:
    id: "e2e/unlock/password"
- tapOn:
    id: "e2e/unlock/password"
- inputText: "${MASTER_PW}"
- hideKeyboard
- tapOn:
    id: "e2e/unlock/submit"
- assertVisible:
    id: "e2e/list/search"
- tapOn:
    id: "e2e/list/lock"
- assertVisible:
    id: "e2e/unlock/password"
- tapOn:
    id: "e2e/unlock/password"
- inputText: "${MASTER_PW}"
- hideKeyboard
- tapOn:
    id: "e2e/unlock/submit"
- assertVisible:
    id: "e2e/list/search"
