# Roles matrix — admin leg. The box verified this member's contact
# (Level 2 code check) and promoted it to admin before this flow runs.
# Asserts the admin surfaces a phone-side admin actually sees.
appId: xyz.actitud.baluard
---
- launchApp:
    clearState: false
- tapOn:
    id: android:id/button2
    optional: true
- tapOn:
    id: e2e/unlock/password
- inputText: ${BALUARD_E2E_MASTER_PW}
- hideKeyboard
- tapOn:
    id: e2e/unlock/submit
# Admin's own code is visible on the People screen.
- extendedWaitUntil:
    visible:
      id: e2e/list/search
    timeout: 45000
- tapOn:
    id: e2e/home/settings
# The People card sits mid-screen in a long Settings list; uiautomator
# reports only visible nodes, so scroll to it first. The rendered
# SectionCard title is uppercase.
- scrollUntilVisible:
    element:
      text: "PEOPLE & ACCESS"
    timeout: 20000
# The own-code display is already asserted in the editor leg (every
# role carries the row); the vault section sits below People, so
# re-asserting here would need a second scroll for no extra coverage.
# The clickable row is the entry subtitle, not the section title.
- tapOn: "Members, join requests, and collection grants"
# The Groups card sits below the members list inside People.
- scrollUntilVisible:
    element:
      text: "GROUPS"
    timeout: 20000
- extendedWaitUntil:
    visible: "GROUPS"
    timeout: 20000
- assertVisible: "Admin"
