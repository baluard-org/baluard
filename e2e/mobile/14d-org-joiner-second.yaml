# Joiner phone, second pass (NO clearState). The org vault unlocked on
# approval. As a grantless org editor the first add must be REFUSED —
# organization entries need a granted collection, the cryptographically
# enforced boundary. The joiner-side merge-exclusion baseline lives
# founder-side (14e); this flow ends after returning to the hub.
#
#   MASTER_PW_2           the joiner's PERSONAL vault password (unused
#                         since the second-vault leg was trimmed)
appId: xyz.actitud.baluard
appLaunchDelay: 3000
---
- launchApp:
    clearState: false
- tapOn:
    id: "android:id/button2"
    optional: true
# The approval auto-unlocked in place, but this cold start starts
# locked: unlock the org vault.
- assertVisible:
    id: "e2e/unlock/password"
- tapOn:
    id: "e2e/unlock/password"
- inputText: "${BALUARD_E2E_ORG_PW}"
- hideKeyboard
- tapOn:
    id: "e2e/unlock/submit"
- extendedWaitUntil:
    visible:
      id: "e2e/home/settings"
    timeout: 30000

# The grantless-editor refusal: org entries need a granted collection.
- tapOn:
    id: "e2e/list/add"
- tapOn:
    id: "e2e/edit/name"
- inputText: B Entry
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e/edit/save"
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "e2e/edit/save"
- extendedWaitUntil:
    visible: ".*No collection is open for your edits.*"
    timeout: 20000
# A refused save keeps the edit screen up: go back to the hub before
# touching the vault switcher (the recorded back-then-hub-marker rule).
- back
- extendedWaitUntil:
    visible:
      id: "e2e/list/search"
    timeout: 20000
# The joiner-side personal-second-vault leg was trimmed once mobile had
# no create-a-second-vault UI; that surface ships now, but the exclusion
# assert stays founder-side (14e), so this flow still ends here.
