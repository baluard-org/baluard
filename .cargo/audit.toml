# cargo-audit advisory policy for the hard release gate (`just audit`).
# An entry here is an accepted, documented risk with a named ADR - never a
# silent drop. New advisories NOT listed here fail `just check` immediately.
#
# All entries cite ADR 0115 (dependency-advisory backlog), which groups the
# findings into dependency-major families with unblocking conditions:
[advisories]
ignore = [
    # Family 1: held by the iroh 0.35 pin (hickory 0.25.x + rustls-webpki
    # 0.102.x); clears when iroh moves and the macOS leg is rerun.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0491",
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0532",
    "RUSTSEC-2026-0549",
    "RUSTSEC-2026-0550",
    "RUSTSEC-2026-0551",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    # Family 2: the zip crate, patched only in 9.x; blocked on the desktop
    # extraction rewrite. Bounded exposure: signed-bytes + size cap + zipslip
    # guard before any entry is written.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    # Family 3: crypto-bigint held by the rsa 0.10-rc pin; same import path
    # ADR 0111 already accepts for RSA.
    "RUSTSEC-2026-0387",
    # The RSA import acceptance itself: Marvin timing side channel, no fixed
    # release upstream (0.10 rc included) - ADR 0111.
    "RUSTSEC-2023-0071",
    # ADR 0116 (MCP agent server): rmcp is pinned at 0.16.0 because every
    # patched line (>=1.4.0) requires MSRV 1.88 against the workspace 1.85
    # floor. RUSTSEC-2026-0189 (DNS rebinding, Streamable HTTP server) is
    # mitigated by the baluard-daemon HTTP guard itself: loopback-only
    # bind, Host-header validation, and browser-Origin rejection
    # implemented as axum middleware in front of rmcp (the spec-mandated
    # defense the CVE says the SDK lacks). Upgrade to rmcp >=1.4.0 rides
    # the next workspace MSRV bump. RUSTSEC-2026-0462 is Streamable HTTP
    # CLIENT buffering; the client transport is not compiled in (server +
    # transport-io features only, verified via cargo tree -e features).
    "RUSTSEC-2026-0189",
    "RUSTSEC-2026-0462",
]
