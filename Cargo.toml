[workspace]
members = [
    "crates/baluard-core",
    "crates/baluard-runtime",
    "crates/baluard-uniffi",
    "crates/baluard-cli",
    "crates/baluard-daemon",
    "crates/baluard-nmh",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.85"

[workspace.dependencies]
# Crypto
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
unicode-normalization = "0.1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke = "0.12"
rand = "0.8"
rand_core = "0.6"

# BIP-39
bip39 = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

# Git
git2 = { version = "0.20", features = ["ssh", "https"] }

# CLI update check / self-update (crates/baluard-cli/src/update.rs)
flate2 = "1"
minisign-verify = "0.2"
semver = "1"
tar = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"
tokio = { version = "1", features = ["full"] }
assert_cmd = "2"
predicates = "3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Bytes
bytes = "1"

# Hex / Base64
hex = "0.4"
base64 = { version = "0.22", features = ["alloc"] }

# Secure memory
zeroize = { version = "1", features = ["derive"] }

# Git provider clients
# Webpki bundled roots: rustls-native-certs (the default) cannot probe the
# Android/iOS trust store, so every octocrab TLS request fails there with a
# bare snafu variant name. Bundled Mozilla roots work on all platforms.
octocrab = { version = "0.44", features = ["rustls-webpki-tokio"] }

# Secret types
secrecy = { version = "0.10", features = ["serde"] }

# Async trait
async-trait = "0.1"

# OS keychain (biometric unlock)
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "crypto-rust", "windows-native"] }

# File timestamp manipulation
filetime = "0.2"

# Protobuf
prost = "0.13"
prost-types = "0.13"

# UniFFI
uniffi = "0.28"

# WebAuthn / FIDO2
passkey = { version = "0.5", default-features = false }
# Response JSON must be browser-shaped (base64url strings, PublicKeyCredential.toJSON).
passkey-types = { version = "0.5", features = ["serialize_bytes_as_base64_string"] }
webauthn-rs = { version = "0.5", default-features = false }
webauthn-rs-proto = { version = "0.5", default-features = false }
webauthn-rs-core = { version = "0.5", default-features = false }
url = "2"
public-suffix = "0.1"
regex-lite = "0.1"
coset = "0.4"

# Platform paths
dirs = "6"

# Cross-process file locking
fd-lock = "4"

# Local .env file loading (dev / test secrets)
dotenvy = "0.15"
