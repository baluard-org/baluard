[workspace]
members = [
    "crates/idtty-core",
    "crates/idtty-cli",
    "crates/idtty-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.85"

[workspace.dependencies]
# Crypto
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke = "0.12"
rand = "0.8"
rand_core = "0.6"

# BIP-39
bip39 = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

# Git
git2 = { version = "0.20", features = ["ssh", "https"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"
tokio = { version = "1", features = ["full"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Bytes
bytes = "1"

# Hex / Base64
hex = "0.4"
base64 = "0.22"

# Secure memory
zeroize = { version = "1", features = ["derive"] }

# Protobuf
prost = "0.13"
prost-types = "0.13"
