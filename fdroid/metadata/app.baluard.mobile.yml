Summary: Git-native password manager with encrypted, device-controlled sync
Description: |
  Baluard stores passwords, passkeys, cards, identities, secure notes, and SSH
  keys in an encrypted local vault. Optional synchronization uses a git
  repository that you control. No Baluard account or central server is needed.
