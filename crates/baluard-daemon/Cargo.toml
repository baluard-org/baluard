[package]
name = "baluard-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Baluard background IPC daemon (Unix socket / Named Pipes server)"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync", "passkey-ceremony"] }
baluard-runtime = { path = "../baluard-runtime" }
log = "0.4"
env_logger = "0.11"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
iroh = { workspace = true, optional = true }
argon2 = { workspace = true }
chrono = "0.4"
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
url = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = "2"
base64 = { workspace = true }
dotenvy.workspace = true
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "ecdsa", "encryption", "p256", "rsa", "sha1"] }
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
rand_core = "0.10"
signature = "3"

[build-dependencies]
prost-build = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["git-sync", "p2p"]
git-sync = ["baluard-core/git-sync"]
p2p = ["baluard-core/p2p", "baluard-runtime/p2p", "dep:iroh"]
e2e-hooks = ["baluard-core/e2e-hooks"]
# TPM-backed devkey seal (ADR 0097 Phase 3); the
# daemon installs the platform store at startup when built with it.
hw-seal = ["baluard-core/hw-seal"]
# FIDO2 security-key seal; installed alongside any platform chip.
fido2 = ["baluard-core/fido2"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"
# Test-only: cheap vault-fixture KDF (see baluard-core's feature docs);
# applies to this crate's test targets, never to shipped binaries.
baluard-core = { path = "../baluard-core", features = ["test-cheap-kdf"] }
