[package]
name = "baluard-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Baluard background IPC daemon (Unix socket / Named Pipes server)"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync"] }
log = "0.4"
env_logger = "0.11"
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
chrono = "0.4"
hex = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = "2"
base64 = { workspace = true }

[build-dependencies]
prost-build = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "ecdsa"] }
rand_core = "0.10"

[features]
default = ["git-sync"]
git-sync = ["baluard-core/git-sync"]
