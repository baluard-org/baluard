[package]
name = "baluard-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI bindings for baluard-runtime + baluard-core (mobile FFI surface)"

[lib]
crate-type = ["cdylib", "lib"]
name = "baluard_uniffi"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync", "uri-match"] }
baluard-runtime = { path = "../baluard-runtime" }
uniffi = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Vendored OpenSSL: lets git2/libgit2 cross-compile for Android ABIs
# (no system OpenSSL on-device; desktop builds keep using the host lib).
openssl-sys = { version = "0.9", features = ["vendored"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
uniffi_bindgen = "0.28"
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
serde_json = { workspace = true }
