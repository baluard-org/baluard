[package]
name = "baluard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for Baluard password manager"

[[bin]]
name = "baluard"
path = "src/main.rs"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync"] }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
rpassword = "7"
chrono = "0.4"
prost = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
getrandom = "0.2"
dotenvy.workspace = true
keyring.workspace = true

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = "3"
regex = "1"

[features]
default = ["git-sync"]
git-sync = ["baluard-core/git-sync"]
