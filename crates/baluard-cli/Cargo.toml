[package]
name = "baluard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for Baluard password manager"

[[bin]]
name = "baluard"
path = "src/main.rs"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync"] }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
rpassword = "7"
chrono = "0.4"
prost = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
getrandom = "0.2"
dotenvy.workspace = true
keyring.workspace = true
serde.workspace = true
sha2.workspace = true
flate2.workspace = true
minisign-verify.workspace = true
semver.workspace = true
tar.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = "3"
regex = "1"
uuid = { workspace = true }
ed25519-dalek.workspace = true

# The e2e harness lives in tests/e2e/main.rs and is excluded from plain
# `cargo test` / `just test`: it only builds when the e2e-hooks feature is
# on (see `just test-e2e`), so a fresh checkout never fails on a missing
# daemon binary.
[[test]]
name = "e2e"
required-features = ["e2e-hooks"]

[features]
default = ["git-sync"]
git-sync = ["baluard-core/git-sync"]
e2e-hooks = ["baluard-core/e2e-hooks"]
# TPM-backed devkey seal (ADR 0097 Phase 3); the
# daemon installs the platform store at startup when built with it.
hw-seal = ["baluard-core/hw-seal"]
# FIDO2 security-key seal: --direct unlock and seal management on
# hardware-sealed vaults. The daemon-first path needs this only in the
# daemon binary, but a --direct caller without it fails closed on any
# SealedHw vault.
fido2 = ["baluard-core/fido2"]
