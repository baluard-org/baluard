[package]
name = "baluard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for Baluard: crypto, vault format, git sync, key lifecycle"

[dependencies]
argon2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
unicode-normalization.workspace = true
sha2 = { workspace = true, features = ["oid"] }
sha1.workspace = true
hmac.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
hpke.workspace = true
rand.workspace = true
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519"] }
rand_core.workspace = true
# FIDO2 CTAP2 client (pure Rust, MIT, vendor-reviewed for the hmac-secret
# seal; docs/plan-yubikey-seal.md Implementation). Optional: builds only
# under the fido2 feature, where the hidapi scaffold needs libusb/libudev
# headers and runtime needs the Yubico udev rules.
ctap-hid-fido2 = { version = "3.6", optional = true, default-features = false, features = [
    "ring",
] }
# RSA verification for the FIDO attestation chain: the Yubico
# attestation hierarchy (root, intermediates, per-device certificates)
# is all-RSA (sha256/sha512 PKCS#1 v1.5), while the hmac-secret seal
# math stays P-256. Verification only; no keygen in production paths.
rsa = "0.9"
# EC verification for the same verifier (ES256 attStmt/links) and the
# assertion-signature oracle in the passkey provider tests (§8 of
# plan-mobile-passkeys). The earlier dev-only placement predates the
# attestation verifier (hwkey/attest.rs), which verifies in production.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
bip39.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
git2 = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
bytes.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true
octocrab.workspace = true
secrecy.workspace = true
async-trait.workspace = true
reqwest.workspace = true
dirs.workspace = true
keyring.workspace = true
filetime.workspace = true
fd-lock.workspace = true
csv = "1.3"
roxmltree = "0.20"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# UniFFI bindings live in the dedicated `baluard-uniffi` crate (plan §3.3 single
# FFI boundary). Core stays idiomatic Rust with no UniFFI annotations.
# WebAuthn authenticator ceremony (Phase 1)
passkey = { workspace = true, optional = true }
passkey-types = { workspace = true, optional = true }
url = { workspace = true, optional = true }
public-suffix = { workspace = true, optional = true }
regex-lite = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
tempfile = "3"
serial_test = "3"
# Phase 0.3 spike — see docs/plan-passkey-rs-evaluation.md
webauthn-rs = { workspace = true, features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto.workspace = true
webauthn-rs-core.workspace = true
url = "2"
public-suffix = "0.1"

[features]
hw-seal = ["dep:secure-enclave-rs", "dep:tss-esapi", "dep:windows-sys"]
# FIDO2 security-key seal (the hmac-secret design in
# docs/plan-yubikey-seal.md). Non-default until the daemon wiring and
# packaging land; MSRV for a build WITH this feature is 1.89 (the crate
# floor) - still under every minimum-platform target's rustc.
fido2 = ["dep:ctap-hid-fido2"]
default = ["full"]
full = ["git-sync", "passkey-ceremony", "uri-match"]
passkey-ceremony = ["dep:passkey", "dep:passkey-types", "passkey-types/serialize_bytes_as_base64_string", "dep:url", "dep:public-suffix", "dep:coset", "dep:tokio"]
# Autofill URI matching (Phase 6): reuses the url + public-suffix deps already
# pulled by passkey-ceremony; regex-lite is matcher-only.
uri-match = ["dep:url", "dep:public-suffix", "dep:regex-lite"]
git-sync = ["dep:git2"]
# Test-only transport relaxation: lets compiled binaries accept file:// (and
# absolute-path) git remotes so the E2E harness can use local bare repos.
# Never enabled in release builds; the just test-e2e recipe turns it on.
e2e-hooks = []
org = []
emergency = []

[target.'cfg(target_os = "android")'.dependencies]
# Same resolved instance libgit2-sys links; gives the error-queue drain
# (ERR_get_error) for on-device TLS setup diagnostics.
openssl-sys = "0.9"
# Direct use: X509::from_pem + raw git_libgit2_opts(GIT_OPT_ADD_SSL_X509_CERT).
# Both resolve to instances already in the graph (openssl-sys 0.9.117 /
# libgit2-sys 0.18.5) - single compiled OpenSSL, verified via cargo tree.
openssl = "0.10"
libgit2-sys = "0.18"
foreign-types = "0.3"

[target.'cfg(all(target_os = "macos"))'.dependencies]
secure-enclave-rs = { version = "1", optional = true }

[target.'cfg(all(target_os = "linux"))'.dependencies]
# TPM 2.0 backend over the TCG ESYS stack; links libtss2-esys/mu/rc
# (tpm2-tss-devel). Talks to /dev/tpmrm0 through the kernel resource
# manager by default; the TSS2_TCTI_* env vars override.
tss-esapi = { version = "7.6", optional = true }

[target.'cfg(all(target_os = "windows"))'.dependencies]
# PCP (TPM 2.0 over CNG) backend for the hw seal; compiles only on
# windows targets, optional everywhere else.
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

