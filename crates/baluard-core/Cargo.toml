[package]
name = "baluard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for Baluard: crypto, vault format, git sync, key lifecycle"

[dependencies]
argon2.workspace = true
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
hpke.workspace = true
rand.workspace = true
rand_core.workspace = true
bip39.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
git2 = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true
bytes.workspace = true
hex.workspace = true
base64.workspace = true
zeroize.workspace = true
octocrab.workspace = true
secrecy.workspace = true
async-trait.workspace = true
reqwest.workspace = true
dirs.workspace = true
keyring.workspace = true
filetime.workspace = true
fd-lock.workspace = true
csv = "1.3"
roxmltree = "0.20"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# UniFFI bindings live in the dedicated `baluard-uniffi` crate (plan §3.3 single
# FFI boundary). Core stays idiomatic Rust with no UniFFI annotations.
# WebAuthn authenticator ceremony (Phase 1)
passkey = { workspace = true, optional = true }
url = { workspace = true, optional = true }
public-suffix = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
tempfile = "3"
serial_test = "3"
# Phase 0.3 spike — see docs/plan-passkey-rs-evaluation.md
webauthn-rs = { workspace = true, features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto.workspace = true
webauthn-rs-core.workspace = true
url = "2"
public-suffix = "0.1"

[features]
default = ["full"]
full = ["git-sync", "org", "emergency", "passkey-ceremony"]
passkey-ceremony = ["dep:passkey", "dep:url", "dep:public-suffix", "dep:coset", "dep:tokio"]
git-sync = ["dep:git2"]
org = []
emergency = []
