[package]
name = "baluard-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Baluard vault-session orchestration (host, state, autosync, PIN escrow) — hostable in-process by the desktop daemon and mobile apps"

[dependencies]
baluard-core = { path = "../baluard-core", features = ["git-sync", "passkey-ceremony"] }
log = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
subtle = "2"
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "ecdsa"] }

[features]
default = ["git-sync"]
git-sync = ["baluard-core/git-sync"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
