[package]
name = "idtty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for IDtty password manager"

[dependencies]
idtty-core = { path = "../idtty-core", features = ["git-sync"] }
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
hex.workspace = true
x25519-dalek.workspace = true
rpassword = "7"
chrono = "0.4"
prost = { workspace = true }

[build-dependencies]
prost-build = "0.13"

[features]
default = ["git-sync"]
git-sync = ["idtty-core/git-sync"]
