[package]
name = "idtty-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "IDtty background IPC daemon (Unix socket / Named Pipes server)"

[dependencies]
idtty-core = { path = "../idtty-core", features = ["git-sync"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
zeroize = { workspace = true }
chrono = "0.4"
hex = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }

[build-dependencies]
prost-build = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["git-sync"]
git-sync = ["idtty-core/git-sync"]
