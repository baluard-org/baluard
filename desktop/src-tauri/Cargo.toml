[package]
name = "baluard-desktop"
version = "0.1.3"
description = "Baluard desktop app"
authors = ["EstebanForge"]
license = "GPL-3.0"
repository = "https://github.com/baluard-org/baluard"
edition = "2024"

[lib]
name = "baluard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Community plugin (no official Tauri biometry plugin exists). Pinned EXACT
# per audit D10: a password manager should upgrade this dependency as a
# conscious decision, not via a caret drift. Review scope on every bump.
# D79: signed in-app updates (AppImage on Linux, .app.tar.gz on macOS).
# Pinned EXACT like the community plugin above: the updater is the one
# dependency that can replace running binaries, so bumps are a conscious
# security review (2.12 embeds the artifact version in the minisign
# trusted comment; require_signed_version refuses version-less legacy sigs).
tauri-plugin-updater = "=2.12.0"
tauri-plugin-biometry = "=0.2.8"
# Exact pin per audit D10: upgrades are conscious, reviewed bumps.
tauri-plugin-notification = "=2.3.3"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Test-only: embedded WebDriver server for the e2e smoke build (release-smoke-testing.md).
# Never enabled in shipped artifacts; the smoke feature is opt-in via the build script.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
prost = "0.13"
anyhow = "1"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
baluard-core = { path = "../../crates/baluard-core" }

# D4: pasteboard concealment marker. objc2-app-kit is already in the graph
# via wry/tao; declaring it direct only adds the NSPasteboard module.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSData"] }

[features]
default = []
smoke = ["dep:tauri-plugin-wdio-webdriver"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
