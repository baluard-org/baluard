[package]
name = "idtty-desktop"
version = "0.1.0"
description = "IDtty desktop app"
authors = ["EstebanForge"]
license = "MIT"
repository = "https://github.com/EstebanForge/IDtty"
edition = "2021"

[lib]
name = "idtty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }
prost-build = "0.13"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
prost = "0.13"
bytes = "1"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
