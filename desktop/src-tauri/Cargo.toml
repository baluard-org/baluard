[package]
name = "baluard-desktop"
version = "0.1.0"
description = "Baluard desktop app"
authors = ["EstebanForge"]
license = "GPL-3.0"
repository = "https://github.com/EstebanForge/Baluard"
edition = "2024"

[lib]
name = "baluard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-biometry = "0.2"
prost = "0.13"
anyhow = "1"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
baluard-core = { path = "../../crates/baluard-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
