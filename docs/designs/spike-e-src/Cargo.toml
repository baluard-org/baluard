[workspace]
resolver = "2"
members = ["core", "tether-responder"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
snow = "0.10"
getrandom = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
