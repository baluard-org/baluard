name: Bug report
description: Report a problem with Baluard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issue content license.** By submitting this issue, you license its contents, including any code or patches you include, to Esteban Cuevas and any successor that maintains the Baluard project, under [GPL-3.0-or-later](https://github.com/baluard-org/baluard/blob/main/LICENSE), and you confirm you have the right to grant that license. You keep ownership of your words and code. The full statement is in [CONTRIBUTING.md](https://github.com/baluard-org/baluard/blob/main/CONTRIBUTING.md#issue-content-licensing).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
      placeholder: The desktop app closes when I unlock the vault after import.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh launch of the app.
      placeholder: |
        1. Open Baluard
        2. Unlock the vault
        3. Open Settings, then Import
        4. Select a Bitwarden export
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Baluard version
      description: Shown in Settings, under About.
      placeholder: "0.7.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux (deb)
        - Linux (rpm)
        - Linux (AppImage)
        - Android
        - Other
    validations:
      required: true
