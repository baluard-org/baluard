# 1.0 release pipeline (SKELETON — review alongside the signing rulings).
#
# Fires only on a pushed v* tag or an explicit workflow_dispatch; pushing
# this file alone runs nothing. The release job publishes a DRAFT release so
# the artifacts can be inspected before going live.
#
# Signing status of record (each is an Esteban-side ruling, not code):
#   - Linux: unsigned by decision (deb/rpm).
#   - macOS: Developer ID + notarization when the certificate secrets below
#     are filled in; without them the build is ad-hoc signed and the app
#     needs right-click-open on first launch.
#   - Windows: Authenticode placeholder; without it SmartScreen warns.
# The version tag is the source of truth for the release name; the version
# bump across Cargo.toml / tauri.conf.json / Android happens in the release
# prep commit, not here.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets feed the channel manifest (publish-updates job only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }} # publish-only dispatch skips the builds
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to ship the placeholder updater key
        run: |
          # H2: a bundle carrying REPLACE_WITH_UPDATER_PUBLIC_KEY installs
          # fine and can then never self-update (the plugin refuses to
          # verify against a placeholder). Fail the release instead.
          if grep -q 'REPLACE_WITH_UPDATER_PUBLIC_KEY' desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json still carries the updater pubkey placeholder.";
            echo "Generate the keypair (just updater-key), commit the public key,";
            echo "and store the private key as the TAURI_SIGNING_PRIVATE_KEY secret.";
            exit 1;
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            rpm \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage daemon + CLI sidecars
        run: |
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          cargo build --release -p baluard-daemon -p baluard-cli
          cp target/release/baluard-daemon "desktop/src-tauri/binaries/baluard-daemon-$TRIPLE"
          cp target/release/baluard "desktop/src-tauri/binaries/baluard-$TRIPLE"

      - name: Build desktop bundles (deb, rpm, appimage)
        env:
          # Updater artifacts (*.AppImage.sig) are only produced when the
          # signing key is present; without it AppImage builds are unsigned
          # and the channel manifest step will refuse them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop
          npm install
          npm run tauri build -- --bundles deb,rpm,appimage

      - name: Collect CLI + daemon archives
        run: |
          mkdir -p dist
          cp target/release/baluard target/release/baluard-daemon dist/
          tar czf "baluard-cli-linux-x86_64.tar.gz" -C dist baluard baluard-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            baluard-cli-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-14
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }} # publish-only dispatch skips the builds
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO(signing): when the Developer ID certificate is provisioned, add
      # an import step here (base64 P12 from secrets) and export
      # APPLE_SIGNING_IDENTITY plus the notarytool credentials for the
      # tauri build below. Without them tauri ad-hoc signs.
      - name: Signing mode
        run: |
          # H2: the same placeholder gate the Linux job runs; this job
          # produces the signed macOS updater artifact.
          if grep -q 'REPLACE_WITH_UPDATER_PUBLIC_KEY' desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json still carries the updater pubkey placeholder.";
            exit 1;
          fi
          if [ -n "${{ secrets.APPLE_CERTIFICATE_P12 }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          else
            echo "MACOS_ADHOC=1" >> "$GITHUB_ENV"
          fi

      - name: Stage daemon + CLI sidecars
        run: |
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          cargo build --release -p baluard-daemon -p baluard-cli
          cp target/release/baluard-daemon "desktop/src-tauri/binaries/baluard-daemon-$TRIPLE"
          cp target/release/baluard "desktop/src-tauri/binaries/baluard-$TRIPLE"

      - name: Build desktop bundle (dmg + updatable app)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop
          npm install
          # The "app" target produces the signed .app.tar.gz the updater
          # installs; the dmg stays the first-install shape.
          npm run tauri build -- --bundles dmg,app

      - name: Collect CLI + daemon archives
        run: |
          mkdir -p dist
          cp target/release/baluard target/release/baluard-daemon dist/
          tar czf "baluard-cli-macos-aarch64.tar.gz" -C dist baluard baluard-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            baluard-cli-macos-aarch64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.tag != '') }} # publish-only dispatch skips the builds
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO(signing): Authenticode goes here (certificate secret or Azure
      # Trusted Signing). Without it the installer is unsigned.
      - name: Signing mode
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_SIGNING_CERT }}" ]; then
            echo "WINDOWS_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "WINDOWS_UNSIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Stage daemon + CLI sidecars
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          mkdir -p desktop/src-tauri/binaries
          cargo build --release -p baluard-daemon -p baluard-cli
          cp target/release/baluard-daemon.exe "desktop/src-tauri/binaries/baluard-daemon-$TRIPLE.exe"
          cp target/release/baluard.exe "desktop/src-tauri/binaries/baluard-$TRIPLE.exe"

      # Desktop installers are deliberately NOT built: the desktop app's
      # daemon IPC is a cfg(not(unix)) stub (Known Limitations #6), so a
      # Windows installer would ship an app that cannot reach its daemon.
      # Restore the msi/nsis bundle step when named-pipe IPC lands.
      - name: Collect CLI + daemon archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/baluard.exe target/release/baluard-daemon.exe dist/
          tar czf baluard-cli-windows-x86_64.tar.gz -C dist baluard.exe baluard-daemon.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: baluard-cli-windows-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft, never auto-published: the artifacts wait for human review
        # (signing state, version pin, smoke status) before going live.
        # On a tag push the tag names the release; on a manual dispatch the
        # version comes from tauri.conf.json so a branch name can never
        # become a release name.
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          fi
          gh release create "$TAG" --draft --generate-notes --title "$TAG" artifacts/*/*

  # D79: the channel manifest is the ONLY mutable piece (fixed updates-beta /
  # updates-stable tags hold it; versioned releases hold immutable artifacts)
  # and it is published LAST, by this separate dispatch, AFTER the versioned
  # release above has been reviewed and published from its draft. Running it
  # earlier would point clients at downloads that are not live yet.
  publish-updates:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    runs-on: ubuntu-24.04
    env:
      # Never interpolate a dispatch input straight into shell: env indirection only.
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*.AppImage' --pattern '*.AppImage.sig' \
            --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig'

      - name: Generate the channel manifest (signature versions asserted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # C2: the channel rule must match the client's is_prerelease
          # (any semver prerelease suffix is beta). An alpha tag routed to
          # the stable manifest would be offered to every stable user.
          case "$TAG" in
            *-*|*beta*|*rc*|*alpha*) echo "refusing prerelease tag; this job publishes the stable manifest"; exit 1 ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          node scripts/generate-updates-manifest.mjs \
            --tag "$TAG" \
            --artifacts-dir release-assets \
            --notes-file notes.md \
            --out latest.json

      - name: Upload the manifest to its channel (manifest moves, artifacts don't)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in
            *beta*|*rc*|*alpha*|*dev*|*pre*) CHANNEL="updates-beta" ;;
            *)                               CHANNEL="updates-stable" ;;
          esac
          gh release view "$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CHANNEL" --repo "$GITHUB_REPOSITORY" \
              --title "$CHANNEL" \
              --notes "Moving manifest for the $CHANNEL updater channel. Do not delete: installed apps poll this release for updates."
          gh release upload "$CHANNEL" --repo "$GITHUB_REPOSITORY" latest.json --clobber
