name: mobile-alpha-apk

# Builds the debug-signed Android APK (release-profile Rust cdylib, arm64-v8a
# only) and attaches it to the "alpha-debug" GitHub release.
#
# The Rust cdylib is NOT committed (.gitignore ships `*.so`), so every run
# builds it. Single ABI + rust-cache + gradle-cache keep that cheap.
#
# Keystore: BALUARD_DEBUG_KEYSTORE_B64 secret = base64 of
# mobile/keystore/debug.keystore (store/key password + alias "baluard").

on:
  workflow_dispatch:

permissions:
  contents: write

# A double-dispatch cancels the older run instead of paying for both.
concurrency:
  group: mobile-alpha
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard ceiling vs the 360-min default: a hung run costs 30 min, not 6 h.
    timeout-minutes: 30
    env:
      APK_ABI: arm64-v8a
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      # Caches ~/.gradle deps + build cache + config cache; stops daemon post-step.
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Caches ~/.cargo and ./target; cargo install cargo-ndk becomes a no-op
      # restore after the first run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.APK_ABI }}
          cache-all-crates: true

      - name: Build Rust cdylib (release, ${{ env.APK_ABI }} only)
        timeout-minutes: 20
        working-directory: mobile
        run: |
          cargo install --locked cargo-ndk
          cargo ndk -t "$APK_ABI" -o androidApp/src/main/jniLibs \
            -- build -p baluard-uniffi --release
          # Fail loud: a missing cdylib used to ship as a crash-on-launch APK.
          test -s "androidApp/src/main/jniLibs/$APK_ABI/libbaluard_uniffi.so"

      - name: Restore keystore
        run: |
          mkdir -p mobile/keystore
          echo "${{ secrets.BALUARD_DEBUG_KEYSTORE_B64 }}" | base64 -d > mobile/keystore/debug.keystore

      - name: Build APK
        working-directory: mobile
        timeout-minutes: 20
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew -Pbaluard.abis="$APK_ABI" :androidApp:assembleDebug
          # Stop the daemon inside the step: a daemon holding the step stdio
          # is the known cause of the next step appearing hung for 15+ min.
          ./gradlew --stop

      - name: Stage APK
        timeout-minutes: 2
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          mv mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "/tmp/baluard-alpha-${STAMP}-${GITHUB_SHA::7}.apk"
          ls -l "/tmp/baluard-alpha-${STAMP}-${GITHUB_SHA::7}.apk"
          echo "APK_NAME=baluard-alpha-${STAMP}-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add today's build (clobber if re-run same day/commit). GitHub
          # uploads of large assets have stalled whole runs before; hard
          # 5-minute timeout + retries so a flaky runner fails fast instead
          # of hanging the workflow.
          ok=1
          for i in 1 2 3; do
            if timeout 300 gh release upload alpha-debug "/tmp/${APK_NAME}" --clobber -R "$GITHUB_REPOSITORY"; then ok=0; break; fi
            echo "upload attempt $i failed/timed out; retrying"; sleep 10
          done
          [ "$ok" = 0 ] || { echo "upload failed after 3 attempts"; exit 1; }
          # Prune: keep the newest 3 date-stamped APKs (alpha policy).
          gh release view alpha-debug -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | grep '^baluard-alpha-2' | sort | head -n -3 \
            | while read -r old; do
                timeout 120 gh release delete-asset alpha-debug "$old" -y -R "$GITHUB_REPOSITORY" || true
              done
