name: mobile-alpha-apk

# Builds the debug-signed Android APK and attaches it to the "alpha-debug"
# GitHub release. Triggered manually (or via `gh workflow run`).
#
# Fast path: uses the committed jniLibs .so (Kotlin/UI changes only).
# Check "rebuild-native" when Rust code changed to rebuild all 4 ABIs.
#
# Keystore: BALUARD_DEBUG_KEYSTORE_B64 secret = base64 of
# mobile/keystore/debug.keystore (store/key password + alias "baluard").

on:
  workflow_dispatch:
    inputs:
      rebuild-native:
        description: "Rebuild the Rust cdylib (slow)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK pieces
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Rebuild Rust native libs (optional)
        if: ${{ inputs.rebuild-native }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk
          cd mobile && cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o androidApp/src/main/jniLibs -- build -p baluard-uniffi

      - name: Restore keystore
        run: |
          mkdir -p mobile/keystore
          echo "${{ secrets.BALUARD_DEBUG_KEYSTORE_B64 }}" | base64 -d > mobile/keystore/debug.keystore

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties

      - name: Build APK
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug

      - name: Stage APK
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          cp mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "/tmp/baluard-alpha-${STAMP}-${GITHUB_SHA::7}.apk"
          echo "APK_NAME=baluard-alpha-${STAMP}-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add today's build (clobber if re-run same day/commit).
          gh release upload alpha-debug "/tmp/${APK_NAME}" --clobber -R "$GITHUB_REPOSITORY"
          # Prune: keep the newest 3 date-stamped APKs (alpha policy).
          gh release view alpha-debug -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | grep '^baluard-alpha-2' | sort | head -n -3 \
            | while read -r old; do
                gh release delete-asset alpha-debug "$old" -y -R "$GITHUB_REPOSITORY" || true
              done
