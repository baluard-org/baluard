# Reference-decryptor conformance: proves a third-party implementation
# (Python stdlib + argon2-cffi/cryptography) reads exactly what Baluard
# writes, byte for byte, from the committed golden vector. This is the
# cross-implementation guard for the .bldbak container spec
# (docs/adr/0099-encrypted-backup.md). Deliberately dependency-light: no Rust
# build — the decryptor needs only pip's argon2-cffi + cryptography.
name: decrypt-vector

# Remote CI is gated on Esteban's approval (2026-10-16) — dispatch-only,
# nothing runs on push. Flip the push block back on when CI is approved.
# The first push-triggered run caught a real bug (Argon2 time/memory
# swapped in the decryptor) — fixed 2026-10-16, unverified until the
# workflow runs again.
on:
  workflow_dispatch:

jobs:
  decrypt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decryptor dependencies
        run: pip install argon2-cffi cryptography

      # Same command the justfile's decrypt-vector recipe runs; the
      # passphrase is the documented test-vector passphrase (not a secret).
      - name: Decrypt the golden vector with the reference implementation
        env:
          BALUARD_BACKUP_PASSPHRASE: correct horse battery staple
        run: python3 scripts/decrypt_backup.py crates/baluard-core/tests/golden/backup-v1.bldbak
